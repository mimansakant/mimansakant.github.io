<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --accent: #4a9eff;
            --accent-dim: #3d7fd9;
            --border: #2a2a2a;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Work Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(61, 127, 217, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            margin-bottom: 4rem;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--accent);
            margin: 2rem 0;
        }

        /* Navigation */
        .main-nav {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        .nav-link.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 3;
            column-gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: var(--bg-card);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .masonry-item:nth-child(1) { animation-delay: 0.1s; }
        .masonry-item:nth-child(2) { animation-delay: 0.15s; }
        .masonry-item:nth-child(3) { animation-delay: 0.2s; }
        .masonry-item:nth-child(4) { animation-delay: 0.25s; }
        .masonry-item:nth-child(5) { animation-delay: 0.3s; }
        .masonry-item:nth-child(6) { animation-delay: 0.35s; }

        .masonry-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.15);
        }

        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.3s ease;
        }

        .masonry-item:hover img {
            transform: scale(1.05);
        }

        /* Optional: Image caption overlay */
        .masonry-item .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: var(--text-primary);
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .masonry-item:hover .caption {
            opacity: 1;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            position: relative;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: var(--text-primary);
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
            line-height: 1;
            transition: color 0.2s ease;
            z-index: 1001;
        }

        .lightbox-close:hover {
            color: var(--accent);
        }

        /* Navigation arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 2rem;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .lightbox-nav:hover {
            background: rgba(74, 158, 255, 0.3);
        }

        .lightbox-prev {
            left: 2rem;
        }

        .lightbox-next {
            right: 2rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 640px) {
            .masonry-grid {
                column-count: 1;
                column-gap: 1rem;
            }

            .masonry-item {
                margin-bottom: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
            }

            .lightbox-nav {
                padding: 0.75rem 1rem;
                font-size: 1.5rem;
            }

            .lightbox-prev {
                left: 1rem;
            }

            .lightbox-next {
                right: 1rem;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Photo Portfolio</h1>
            <p class="subtitle">A collection of my photography work</p>
            <div class="divider"></div>
        </header>

        <div class="masonry-grid">

            <div class="masonry-item" onclick="openLightbox(24)">
                <img src="images/IMG-20226...WA0032.jpg" alt="Photo 25">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">×</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1, event)">‹</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
        </div>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1, event)">›</button>
    </div>

    <script>
        let currentImageIndex = 0;
        const images = document.querySelectorAll('.masonry-item img');

        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = images[index].src;
            lightboxImg.alt = images[index].alt;
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event) {
                event.stopPropagation();
            }
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        function navigateLightbox(direction, event) {
            event.stopPropagation();
            currentImageIndex += direction;
            
            if (currentImageIndex < 0) {
                currentImageIndex = images.length - 1;
            } else if (currentImageIndex >= images.length) {
                currentImageIndex = 0;
            }
            
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = images[currentImageIndex].src;
            lightboxImg.alt = images[currentImageIndex].alt;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                navigateLightbox(-1, e);
            } else if (e.key === 'ArrowRight') {
                navigateLightbox(1, e);
            }
        });
    </script>
</body>
</html>
