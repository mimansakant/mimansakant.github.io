<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Projects</title>

    <!-- Same fonts as main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --accent: #4a9eff;
            --accent-dim: #3d7fd9;
            --border: #2a2a2a;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Work Sans', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(61, 127, 217, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 700px;
            padding: 3rem 2rem;
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--accent);
            margin: 2.5rem auto;
        }

        .back-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Projects Coming Soon</h1>

        <div class="divider"></div>

        <p>
            Thanks for stopping by! I’m currently building out and refining my software projects.
            This page will be updated soon with live demos, GitHub repositories, and technical write-ups.
        </p>

        <p>
            In the meantime, feel free to connect with me on LinkedIn or check back soon.
        </p>

        <a href="../" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
